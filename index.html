<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার বাজার - অনলাইন শপিং</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#333;
}
header{
 background:#f57224;
 color:white;
 padding:15px;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:25px;font-weight:bold}
.search{
 width:100%;
 padding:13px;
 border:0;
 border-radius:7px;
 margin-top:15px;
 font-size:15px;
}
.banner{
 background:#ffeadb;
 margin:15px;
 padding:25px 15px;
 border-radius:12px;
 text-align:center;
}
.banner h2{color:#e85d12}
.categories,.products{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:12px;
}
.category,.product{
 background:white;
 padding:12px 5px;
 border-radius:9px;
 text-align:center;
}
.category{font-size:14px}
.section-title{
 padding:0 15px;
 font-size:19px;
}
.products{
 grid-template-columns:repeat(2,1fr);
}
.product img{
 width:100%;
 height:120px;
 object-fit:contain;
}
.price{
 color:#f57224;
 font-weight:bold;
 font-size:18px;
}
button{
 background:#f57224;
 color:white;
 border:0;
 padding:9px;
 border-radius:5px;
 width:100%;
}
footer{
 background:#333;
 color:white;
 padding:20px;
 text-align:center;
}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">আমার বাজার</div>
  <div>🛒 কার্ট</div>
 </div>
 <input class="search" id="search"
 placeholder="আপনি কী খুঁজছেন?"
 oninput="searchProducts()">
</header>

<div class="banner">
 <h2>স্বাগতম আমার বাজারে!</h2>
 <p>হাজারো পণ্য, এক ঠিকানায়।</p>
 <b>কেনাকাটা হোক সহজ ও আনন্দময়</b>
</div>

<h3 class="section-title">পণ্যের ক্যাটাগরি</h3>
<div class="categories">
 <div class="category">👕<br>ফ্যাশন</div>
 <div class="category">📱<br>ইলেকট্রনিক্স</div>
 <div class="category">🏠<br>ঘর ও আসবাব</div>
 <div class="category">🛒<br>গ্রোসারি</div>
 <div class="category">⌚<br>ঘড়ি</div>
 <div class="category">👶<br>শিশু পণ্য</div>
</div>

<h3 class="section-title">জনপ্রিয় পণ্য</h3>
<div class="products" id="products">

<div class="product">
 <img src="https://placehold.co/300x200?text=Headphone">
 <p>হেডফোন</p>
 <div class="price">৳৫৫০</div>
 <button onclick="alert('পণ্যটি কার্টে যোগ হয়েছে')">
 কার্টে যোগ করুন
 </button>
</div>

<div class="product">
 <img src="https://placehold.co/300x200?text=Watch">
 <p>হাতঘড়ি</p>
 <div class="price">৳৭৫০</div>
 <button onclick="alert('পণ্যটি কার্টে যোগ হয়েছে')">
 কার্টে যোগ করুন
 </button>
</div>

</div>

<footer>
 <h3>আমার বাজার</h3>
 <p>আপনার বিশ্বস্ত অনলাইন মার্কেটপ্লেস</p>
</footer>

<script>
function searchProducts(){
 let q=document.getElementById('search').value;
 document.querySelectorAll('.product').forEach(p=>{
  p.style.display=p.innerText.includes(q)?'block':'none';
 });
}
</script>

</body>
</html>
